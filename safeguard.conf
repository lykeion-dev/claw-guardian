# =============================================================================
# Safeguard Watchdog Configuration (v6 — Semantic-only + Fallback + Multiplier Timing)
# =============================================================================

# --- Safeguard Model (判定用AI) ---
SAFEGUARD_PROVIDER="nvidia-nim"
SAFEGUARD_MODEL="nvidia/nemotron-content-safety-reasoning-4b"
SAFEGUARD_API_URL=""
SAFEGUARD_API_KEY="${NVIDIA_API_KEY:-}"

# Fallback Safeguard (v6: warning-only on both failures)
SAFEGUARD_FALLBACK_PROVIDER="openrouter"
SAFEGUARD_FALLBACK_MODEL="openai/gpt-oss-safeguard-20b"
SAFEGUARD_FALLBACK_API_URL=""
SAFEGUARD_FALLBACK_API_KEY="${OPENROUTER_API_KEY:-}"
SAFEGUARD_FALLBACK_DURATION=600

# --- Embedding Model (意味的類似度検出) ---
#
# EMBEDDING_PROVIDER を設定すると、ループ検出の類似度比較が embedding ベース（意味レベル）になる。
# v6: SequenceMatcher（文字列レベル）は削除済み。embedding のみ。
# プライマリ失敗時は FALLBACK_EMBEDDING_* があれば一定時間フォールバック有効化。
#
# プロバイダ別デフォルト:
#   openai     : api.openai.com/v1/embeddings           
#   cohere     : api.cohere.ai/v1/embed                  
#   groq       : api.groq.com/openai/v1/embeddings       
#   mistral    : api.mistral.ai/v1/embeddings            
#   dashscope  : dashscope-intl.../compatible-mode/v1/... 
#   nvidia-nim : integrate.api.nvidia.com/v1/embeddings  
#   local      : localhost:11434/v1/embeddings (Ollama)  
#   openrouter : openrouter.ai/api/v1/embeddings         
#
# EMBEDDING_API_KEY: 専用キー。空なら EMBEDDING_API_KEY → OPENAI_API_KEY → ...
#                    の優先順位で環境変数から自動選択。
# =============================================================================

EMBEDDING_PROVIDER="cohere"
EMBEDDING_MODEL="embed-v4.0"
EMBEDDING_API_URL="https://api.cohere.ai/v1/embed"
EMBEDDING_API_KEY="${COHERE_API_KEY:-}"

# Fallback Embedding (v6: activates on primary failure for FALLBACK_EMBEDDING_DURATION seconds)
FALLBACK_EMBEDDING_PROVIDER=""
FALLBACK_EMBEDDING_MODEL=""
FALLBACK_EMBEDDING_API_URL=""
FALLBACK_EMBEDDING_API_KEY=""
FALLBACK_EMBEDDING_DURATION=300

# --- API Keys (safeguard.env で設定) ---
OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-}"

# --- Paths ---
AGENTS_DIR="$HOME/.openclaw/agents"
OPENCLAW_CONFIG="$HOME/.openclaw/openclaw.json"

# --- Notification Target ---
# When a dangerous call or loop is detected, send notification to this session.
# If empty, send to the session where the problem was detected (default behavior).
# Example: "agent:main:discord:channel:1489842870851731667"
#NOTIFICATION_SESSION_KEY="agent:main:discord:channel:1489842870851731667"

# --- Polling (v6: multiplier-based timing) ---
SCAN_BASE_MS=5000
VELOCITY_MULTIPLIER=1
EXACT_MULTIPLIER=2
SIMILARITY_MULTIPLIER=6
POLL_INTERVAL=$((SCAN_BASE_MS / 1000))

# --- Context Window ---
CONTEXT_TURNS=5

# --- Rejection Policy ---
REJECT_THRESHOLD=2
REJECT_WINDOW=4

# =============================================================================
# Session Filter — Whitelist / Blacklist (dual mode)
# =============================================================================
# FILTER_MODE: "whitelist" | "blacklist"
#   whitelist = ONLY monitor matching sessions
#   blacklist = monitor ALL except matching sessions
FILTER_MODE="whitelist"

# Comma-separated lists (empty = no filter)
# Providers: openrouter, xiaomi, anthropic, etc.
FILTER_PROVIDERS=""
# Agent IDs: main, my-agent, etc.
FILTER_AGENTS="main"
# Model patterns (substring match, case-insensitive): gpt-4, claude, etc.
FILTER_MODEL_PATTERNS=""

# Legacy compat (mapped to blacklist mode)
EXCLUDE_PROVIDERS="${FILTER_PROVIDERS}"
EXCLUDE_MODEL_PATTERNS="${FILTER_MODEL_PATTERNS}"
EXCLUDE_AGENTS="${FILTER_AGENTS}"

WRITE_AGENTS_ONLY="true"
MAX_MONITOR_PROCESSES=20
MIN_CONTEXT_K=0

# =============================================================================
# Loop Detection (3-Layer System)
# =============================================================================

# Layer 1: Similarity Detection (v6: type:text + type:thinking, semantic-only)
SIMILARITY_THRESHOLD=0.85
SIMILARITY_LOOKBACK=3
SUSPICION_DURATION=30

# Layer 2: Token Velocity Detection (every scan)
VELOCITY_WINDOW_SEC=10
VELOCITY_MAX_BYTES=100000
VELOCITY_ABORT_RATE=8000

# Layer 3: Exact Match Detection (v6: targets type:toolCall only)
LOOP_THRESHOLD=3

# =============================================================================
# Abort Behavior
# =============================================================================
LOOP_ABORT_COOLDOWN=60

# =============================================================================
# Abort Fallback — what happens after REJECT / loop abort
# =============================================================================
# ABORT_FALLBACK_MODE:
#   "switch"   — switch to fallback model, inject warning, resume work
#   "resume"   — inject warning, resume work WITHOUT model switch
#   "none"     — abort only, no resume (legacy behavior)
ABORT_FALLBACK_MODE="switch"

# Fallback model (used when mode=switch, no per-agent override)
# If empty, uses OPENCLAW fallback model from openclaw.json
ABORT_FALLBACK_MODEL="z-ai/glm-5.1"

# =============================================================================
# Emergency Shutdown — kill gateway after repeated aborts
# =============================================================================
# 0 = disabled
EMERGENCY_SHUTDOWN_ABORT_COUNT=0
# Time window for counting aborts (seconds)
EMERGENCY_SHUTDOWN_WINDOW=300
# "gateway" = stop openclaw gateway, "system" = sudo shutdown
EMERGENCY_SHUTDOWN_ACTION="gateway"

# =============================================================================
# Notification & Logging
# =============================================================================
NOTIFY_MODE="log"
LOG_MAX_SIZE=10857600

# Log verbosity: "verbose" | "normal" | "quiet"
#   verbose = log all gateway responses in full
#   normal  = log gateway responses as summary (ok/model only)
#   quiet   = only log errors and significant events
LOG_VERBOSITY="normal"

# Threshold for [SCAN] log output (ms). 0 = always log.
LOG_SCAN_THRESHOLD_MS=500

# Threshold for [CYCLE] log output (ms). 0 = always log.
LOG_CYCLE_THRESHOLD_MS=2000

# How often to output [STATUS] (in cycles). 0 = disable.
LOG_STATUS_INTERVAL=60

# Threshold for [SLOW] daemon request warning (ms). 0 = disable.
LOG_SLOW_THRESHOLD_MS=500

# =============================================================================
# Panic Button (Desktop)
# =============================================================================
PANIC_BUTTON_ENABLED="true"
# Position: "bottom-right", "bottom-left", "top-right", "top-left"
PANIC_BUTTON_POSITION="bottom-right"
